# ══════════════════════════════════════════════════════════════════════
#  CD — deploys to staging, then to production behind an approval gate.
#  Triggered by CI finishing successfully on main.
# ══════════════════════════════════════════════════════════════════════
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # ── STAGING: automatic ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: staging
      url: https://${{ vars.STAGING_APP_NAME }}.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      # Build a REAL zip file. Passing a directory caused EISDIR before,
      # because the action tried to read "." as if it were an archive.
      # The unzip -l listing proves app.py is at the top level BEFORE
      # Azure ever sees the package.
      - name: Create deployment zip
        run: |
          zip -r deploy.zip . -x ".git/*" ".github/*" "tests/*" "*.pyc" "__pycache__/*"
          echo "--- contents of deploy.zip ---"
          unzip -l deploy.zip

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.STAGING_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_STAGING_PUBLISH_PROFILE }}
          package: deploy.zip

      # ── SMOKE TEST ──────────────────────────────────────────────────
      # Deploying is not the same as working. This proves the live site
      # actually responds before we call the deploy a success.
      - name: Smoke test /health
        run: |
          URL="https://${{ vars.STAGING_APP_NAME }}.azurewebsites.net/health"
          echo "Waiting for app to warm up..."
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Staging is healthy:"
              cat /tmp/body
              exit 0
            fi
            echo "  attempt $i - got HTTP $CODE, retrying in 10s"
            sleep 10
          done
          echo "SMOKE TEST FAILED - staging did not become healthy"
          exit 1

  # ── PRODUCTION: gated ──────────────────────────────────────────────
  # Identical steps, but the 'production' GitHub Environment has a
  # required reviewer, so this job PAUSES until a human approves.
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: deploy-staging          # staging must pass its smoke test first

    environment:
      name: production
      url: https://${{ vars.PRODUCTION_APP_NAME }}.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . -x ".git/*" ".github/*" "tests/*" "*.pyc" "__pycache__/*"
          echo "--- contents of deploy.zip ---"
          unzip -l deploy.zip

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.PRODUCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PRODUCTION_PUBLISH_PROFILE }}
          package: deploy.zip

      - name: Smoke test /health
        run: |
          URL="https://${{ vars.PRODUCTION_APP_NAME }}.azurewebsites.net/health"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Production is healthy:"
              cat /tmp/body
              exit 0
            fi
            echo "  attempt $i - got HTTP $CODE, retrying in 10s"
            sleep 10
          done
          echo "SMOKE TEST FAILED - rolling back is now your move"
          exit 1