# ══════════════════════════════════════════════════════════════════════
#  CI — runs on every push and pull request.
#  Purpose: prove the code is sound. Deploys nothing.
# ══════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:          # adds a manual "Run workflow" button

concurrency:                  # a newer push cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v --junitxml=junit.xml

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()               # publish even when tests FAIL
        with:
          report_paths: junit.xml
          check_name: Tests (py${{ matrix.python-version }})

  # ── PACKAGE ────────────────────────────────────────────────────────
  # BUILD ONCE, DEPLOY MANY. This produces the single artifact that
  # every environment will receive. Staging and production get the
  # exact same bytes — no rebuilding per environment.
  package:
    name: Package artifact
    runs-on: ubuntu-latest
    needs: test                    # only runs if tests passed
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p dist
          cp -r app.py requirements.txt dist/
          echo "${{ github.sha }}" > dist/BUILD_SHA
          echo "Packaged build ${{ github.sha }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: dist/
          retention-days: 30
